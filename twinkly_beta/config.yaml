name: Christmas Control Center Beta
slug: twinkly_kerst_beta
version: 2.0.0-beta.3
description: Lokale kerstlichtstudio voor Twinkly, lichtshows en muziekeffecten. Experimentele directe Hue- en Govee-bediening.
url: https://github.com/ferrynl/ha-twinkly
arch:
- amd64
- aarch64
startup: application
boot: manual
init: false
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 18491
panel_icon: mdi:string-lights
options:
  ddp_source: 127.0.0.1
  discovery_broadcast: 255.255.255.255
  fps: 20
  media_player: ''
schema:
  ddp_source: str
  discovery_broadcast: str
  fps: int(5,25)
  media_player: str
