function modelInfo(code, device) {
  const strings = /^TWS(\d{2,4})(SPP|STP|GOP)[A-Z0-9-]*$/i.exec(code);
  if (strings) {
    const rgbw = strings[2].toUpperCase() === 'SPP';
    const suffix = {SPP:'RGB+W',STP:'RGB',GOP:'AWW'}[strings[2].toUpperCase()];
    return {name:'Twinkly Strings · ' + device.leds + ' LEDs · ' + suffix,
      page:'https://twinkly.com/nl-nl/' + (rgbw ? 'products/strings-multicolor-white' : 'collections/strings'),
      photo:rgbw ? 'https://twinkly.com/cdn/shop/files/TWS250SPP-BEU_Out-of-the-box.jpg?v=1769612111&width=240' : ''};
  }
  if (/^TWL\d{2,4}STW[A-Z0-9-]*$/i.test(code)) {
    return {name:'Twinkly Line · ' + device.leds + ' LEDs',page:'https://twinkly.com/nl-nl/products/line',
      photo:'https://twinkly.com/cdn/shop/files/TWL100STW-BEU_Out-of-the-box.jpg?v=1757667667&width=240'};
  }
  return {name:productLabels[lang.value][2] + ' · ' + code};
}
function drawProduct(card, device) {
  const code = typeof device.product_code === 'string' ? device.product_code.trim() : '';
  card.product.hidden = !code;
  if (!code) return;
  const signature = code + '/' + device.leds + '/' + lang.value;
  if (card.productSignature === signature) return;
  card.productSignature = signature;
  const model = modelInfo(code,device);
  const labels = productLabels[lang.value];
  const title = document.createElement('strong'), subtitle = document.createElement('small');
  const body = document.createElement('div');
  title.textContent = model.name;
  subtitle.textContent = model.page ? code : '';
  body.append(title,subtitle);
  if (model.page) {
    const link = document.createElement('a');
    link.href = model.page; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.textContent = labels[0];
    body.append(link);
  }
  card.product.replaceChildren();
  if (model.photo) {
    const photo = document.createElement('img');
    photo.loading = 'lazy'; photo.referrerPolicy = 'no-referrer';
    photo.alt = labels[1];
    photo.onerror = () => { photo.hidden = true; };
    photo.src = model.photo;
    subtitle.textContent = code + ' · ' + labels[1];
    card.product.append(photo);
  }
  card.product.append(body);
}
const keys = 'tag all on off color brightness music stop setup add scan busy done receiving waiting disconnected load choose effect movie empty found enabled ip setupDone setupFailed'.split(' ');
const byId = id => document.getElementById(id);
const cards = new Map();

lang.value = localStorage.getItem('twinkly-language') || 'nl';
if (!lang.value) lang.value = 'nl';
const t = key => strings[lang.value][keys.indexOf(key)];
let busy = false, status;
async function request(path, data) {
  const response = await fetch('./' + path, data === undefined ? {cache:'no-store'} : {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
  });
  if (!response.ok) throw Error('HTTP ' + response.status);
  return response.json();
}
function translated(el, key) { el.dataset.text = key; el.textContent = t(key); }
async function perform(el, action) {
  if (busy) return;
  busy = true;
  el.disabled = true;
  byId('message').textContent = t('busy');
  try { byId('message').textContent = await action(); await refresh(); }
  catch (error) { byId('message').textContent = error.message; }
  finally { el.disabled = false; busy = false; }
}
function button(parent, key, action, primary = false) {
  const el = document.createElement('button');
  translated(el, key);
  if (primary) el.className = 'primary';
  el.onclick = () => perform(el, action);
  parent.append(el);
  return el;
}
async function run(id, action, value, group) {
  const result = await request('control', {id, action, value, group});
  return result.failed.length ? result.failed.join(' · ') : t('done');
}
function controls(parent, id, group) {
  const power = {};
  for (const key of ['on','off','music','stop']) power[key] = button(parent, key, () => run(id,key,undefined,group));
  const color = document.createElement('input');
  color.type = 'color'; color.value = '#e8a043'; color.dataset.label = 'color';
  color.setAttribute('aria-label',t('color'));
  parent.append(color); button(parent,'color', () => run(id,'color',color.value,group));
  const level = document.createElement('input');
  level.type = 'number'; level.min = 0; level.max = 100; level.value = 65; level.dataset.label = 'brightness';
  level.setAttribute('aria-label',t('brightness'));
  if (id === '*') {
    const fader = document.createElement('div'), output = document.createElement('output');
    fader.className = 'desk-fader';
    level.type = 'range';
    level.oninput = () => { output.textContent = level.value + '%'; };
    level.oninput();
    fader.append(level,output);
    button(fader,'brightness', () => run(id,'brightness',level.valueAsNumber,group), true);
    parent.append(fader);
  } else {
    parent.append(level); button(parent,'brightness', () => run(id,'brightness',level.valueAsNumber,group));
  }
  return power;
}
async function encodeImage(file) {
  if (!file || !['image/jpeg','image/png','image/webp'].includes(file.type) || file.size > 10_000_000) throw Error(extra(9));
  const bitmap = await createImageBitmap(file);
  try {
    const canvas = document.createElement('canvas');
    const scale = Math.min(1,480/Math.max(bitmap.width,bitmap.height));
    canvas.width = Math.max(1,Math.round(bitmap.width*scale));
    canvas.height = Math.max(1,Math.round(bitmap.height*scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#111'; context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(bitmap,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',.82).split(',')[1];
  } finally { bitmap.close(); }
}
function renderEffects(card) {
  card.grid.replaceChildren();
  const [note, play, customName, save] = effectLabels[lang.value];
  card.note.textContent = card.effects.length ? note : '';
  for (const entry of card.effects) {
    const original = entry.name || t(entry.kind) + ' ' + entry.id;
    const key = 'twinkly-effect:' + JSON.stringify([card.id,entry.kind,entry.id,entry.name || '']);
    const tile = document.createElement('div');
    tile.className = 'effect-card';
    const title = document.createElement('strong');
    title.textContent = localStorage.getItem(key) || original;
    const playButton = document.createElement('button');
    playButton.textContent = play;
    playButton.onclick = () => perform(playButton, () => run(card.id,'effect',[entry.kind,entry.id]));
    const name = document.createElement('input');
    name.type = 'text'; name.maxLength = 60;
    name.placeholder = customName;
    name.setAttribute('aria-label',customName + ' · ' + original);
    name.value = localStorage.getItem(key) || '';
    const saveButton = document.createElement('button');
    saveButton.textContent = save;
    saveButton.onclick = () => {
      const value = name.value.trim();
      if (value) localStorage.setItem(key,value);
      else localStorage.removeItem(key);
      title.textContent = value || original;
      byId('message').textContent = t('done');
    };
    const imagePath = 'effect-image?' + new URLSearchParams({id:card.id,kind:entry.kind,index:entry.id});
    const image = document.createElement('img');
    image.className = 'effect-image'; image.alt = title.textContent; image.hidden = true;
    const remove = document.createElement('button');
    remove.textContent = extra(8); remove.hidden = true;
    image.onload = () => { image.hidden = false; remove.hidden = false; };
    image.onerror = () => { image.hidden = true; remove.hidden = true; };
    const upload = document.createElement('input');
    upload.type = 'file'; upload.accept = 'image/jpeg,image/png,image/webp';
    upload.setAttribute('aria-label',extra(7));
    const uploadLabel = document.createElement('label');
    uploadLabel.textContent = extra(7); uploadLabel.append(upload);
    upload.onchange = () => {
      if (!upload.files.length) return;
      perform(upload, async () => {
        const encoded = await encodeImage(upload.files[0]);
        await request(imagePath,{image:encoded});

function drawLayout(card) {
  const [load, empty, positions, synthetic, rotate] = layoutLabels[lang.value];
  card.mapButton.textContent = load;
  if (!card.layout) return;
  const {points, source, synthesized} = card.layout;
  card.mapInfo.textContent = points.length
    ? [points.length + ' ' + positions, source, synthesized ? synthetic : ''].filter(Boolean).join(' · ')
    : empty;
  card.canvas.hidden = !points.length;
  card.rotation.hidden = source !== '3d' || !points.length;
  card.rotation.setAttribute('aria-label',rotate);
  if (!points.length) return;
  const ctx = card.canvas.getContext('2d');
  const {width, height} = card.canvas;
  ctx.clearRect(0,0,width,height);
  const angle = source === '3d' ? Number(card.rotation.value) * Math.PI / 180 : 0;
  const projected = points.map(([id,x,y,z]) => [id,x*Math.cos(angle)+z*Math.sin(angle),y]);
  const xs = projected.map(p => p[1]), ys = projected.map(p => p[2]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = Math.min((width-30)/(maxX-minX || 1),(height-30)/(maxY-minY || 1));
  const radius = Math.max(1.7,Math.min(5,100/Math.sqrt(points.length)));
  for (const [id,x,y] of projected) {
    ctx.fillStyle = 'hsl(' + (40 + 145*id/Math.max(1,points.length-1)) + ' 75% 65%)';
    ctx.beginPath();
    ctx.arc(width/2 + (x-(minX+maxX)/2)*scale,height/2 - (y-(minY+maxY)/2)*scale,radius,0,Math.PI*2);
    ctx.fill();
  }
}
let editingGroup = null, groupSignature = '', memberSignature = '';

function renderGroups() {

byId('group-cancel').onclick = () => editGroup(null);
byId('group-form').onsubmit = event => {

function drawDetails(card) {

function render() {

  }
}

const livePanel = byId('music-preview-panel');

function updatePreviewLabels() {

async function paintPreview() {
  if (livePanel.hidden) return;

    const canvas = byId('music-preview'), ctx = canvas.getContext('2d');
    let frame = [];
    try {
      const response = await fetch('./music-preview',{cache:'no-store'});
      if (response.ok) frame = new Uint8Array(await response.arrayBuffer());
    } catch {}
    if (livePanel.hidden) return;
    ctx.fillStyle = '#0b1616';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    byId('music-preview-status').textContent = frame.length ? '' : previewText[lang.value][4];
    for (let i=0; i+2<frame.length; i+=3) {

      ctx.fillRect(i,0,3,canvas.height);
