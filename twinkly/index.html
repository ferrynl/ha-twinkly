<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twinkly Kerst</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff7e9;background:radial-gradient(ellipse at 85% 0,#304e43 0,transparent 42%),#0b1616;font:16px system-ui}main{max-width:1140px;margin:auto;padding:clamp(16px,4vw,44px)}header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}h1{font:700 clamp(2.6rem,7vw,5rem) Georgia;margin:0;color:#ffe2a5}h2,h3,p{margin:0 0 12px}p{color:#c5d8d2}section,article{padding:20px;border:1px solid #3b5951;border-radius:22px;background:linear-gradient(145deg,#1c3430,#122422);box-shadow:0 12px 26px #0005}section{margin-top:18px}.eyebrow{letter-spacing:.16em;font-size:.78rem;color:#facb7e;text-transform:uppercase}.status{display:inline-block;border-radius:100px;background:#213e34;padding:8px 14px;margin:12px 0 0}#devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:18px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select,input{font:inherit;border:1px solid #66877b;background:#213c34;color:#fff7e9;border-radius:10px;padding:8px 11px;max-width:100%}button{cursor:pointer}button:hover{background:#38584a}.primary{background:#f6ce88;color:#132721;border-color:#f6ce88;font-weight:700}.primary:hover{background:#ffdfa6}button:disabled{opacity:.55}input[type=color]{width:48px;height:40px;padding:4px}input[type=number]{width:76px}.gap{margin-top:14px}#message{margin:12px 0 0;overflow-wrap:anywhere}.effects{margin-top:12px;width:100%}.error{color:#ffb5a0;overflow-wrap:anywhere}
.power-active{background:#f6ce88;color:#132721;border-color:#f6ce88;font-weight:700}.effect-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-top:10px}.effect-card{display:grid;gap:7px;min-width:0;padding:10px;background:#142925;border:1px solid #48665d;border-radius:12px;text-align:left;overflow-wrap:anywhere;font-size:.9rem}.effect-card input,.effect-card button{width:100%}.preview-note{font-size:.82rem;margin-top:10px}
.led-map{margin-top:12px}.led-map [hidden]{display:none}.led-map canvas{display:block;width:100%;height:auto;background:#0b1616;border:1px solid #48665d;border-radius:12px}.led-map input{width:100%;margin-top:8px}
</style>
<main>
<header><div><p class="eyebrow" data-text="tag"></p><h1>Twinkly Kerst</h1><p class="status" id="audio" role="status"></p></div>
<select id="language" aria-label="Language"><option value="nl">Nederlands</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option></select></header>
<section><h2 data-text="all"></h2><div class="controls" id="all"></div>
<div class="controls gap" id="music-setup"></div>
<div class="controls gap" id="music-styles"><label for="music-style" id="style-label"></label><select id="music-style"></select></div>
<div class="controls gap" id="scan"><input id="ip" placeholder="192.168.1.50" inputmode="decimal"></div>
<p id="message" role="status"></p></section>
<div id="devices"></div>
</main>
<script>
const strings = {
 nl:['Lichtbediening','Alle lampen','Aan','Uit','Kleur','Helderheid %','Muziek','Stop muziek','Music Assistant koppelen','IP toevoegen','Zoeken op netwerk','Bezig…','Opdracht verwerkt.','LedFx-frames worden ontvangen','Wacht op LedFx-muziekeffect','Verbinding met de add-on ontbreekt','Effecten laden','Kies een effect','Effect','Film','Geen lokale effecten gevonden','Apparaten gevonden','Muziek aan','Twinkly IPv4-adres','LedFX ingesteld. Voeg LedFx Twinkly toe aan je Music Assistant-afspeelgroep.','Koppeling mislukt'],
 en:['Lighting controls','All lights','On','Off','Colour','Brightness %','Music','Stop music','Connect Music Assistant','Add IP','Scan network','Working…','Command processed.','Receiving LedFx frames','Waiting for a LedFx music effect','Add-on connection unavailable','Load effects','Choose an effect','Effect','Movie','No local effects found','Devices found','Music enabled','Twinkly IPv4 address','LedFX configured. Add LedFx Twinkly to your Music Assistant playback group.','Setup failed'],
 es:['Control de iluminación','Todas las luces','Encender','Apagar','Color','Brillo %','Música','Detener música','Conectar Music Assistant','Añadir IP','Buscar en la red','Procesando…','Orden procesada.','Recibiendo datos de LedFx','Esperando un efecto musical de LedFx','Conexión con la aplicación no disponible','Cargar efectos','Elige un efecto','Efecto','Película','No se encontraron efectos locales','Dispositivos encontrados','Música activada','Dirección IPv4 de Twinkly','LedFX configurado. Añade LedFx Twinkly al grupo de reproducción de Music Assistant.','Error de configuración'],
 de:['Lichtsteuerung','Alle Lichter','Ein','Aus','Farbe','Helligkeit %','Musik','Musik stoppen','Music Assistant verbinden','IP hinzufügen','Netzwerk durchsuchen','Wird ausgeführt…','Befehl verarbeitet.','LedFx-Frames werden empfangen','Warte auf einen LedFx-Musikeffekt','Verbindung zur App fehlt','Effekte laden','Effekt auswählen','Effekt','Film','Keine lokalen Effekte gefunden','Geräte gefunden','Musik aktiviert','Twinkly-IPv4-Adresse','LedFX eingerichtet. Füge LedFx Twinkly zur Wiedergabegruppe in Music Assistant hinzu.','Einrichtung fehlgeschlagen']
};
const effectLabels = {
 nl:['Probeer het echte effect op de lamp. Geef het daarna een herkenbare naam.','Afspelen op lamp','Eigen naam','Naam opslaan'],
 en:['Play the actual effect on the light, then give it a name you recognise.','Play on light','Custom name','Save name'],
 es:['Reproduce el efecto real en la luz y dale un nombre que reconozcas.','Reproducir en la luz','Nombre personalizado','Guardar nombre'],
 de:['Spiele den echten Effekt am Licht ab und gib ihm einen Namen, den du wiedererkennst.','Am Licht abspielen','Eigener Name','Namen speichern']
};
const musicStyles = {
 nl:['Muziekstijl','Stijl toepassen','Muziekstijl ingesteld.','Energiepuls','Kleurenspectrum','Bas en slag','Kleurgolf','Stroboscoop (snelle flitsen)'],
 en:['Music style','Apply style','Music style applied.','Energy pulse','Colour spectrum','Bass and beat','Colour wave','Strobe (rapid flashes)'],
 es:['Estilo musical','Aplicar estilo','Estilo aplicado.','Pulso de energía','Espectro de colores','Bajos y ritmo','Onda de color','Estroboscopio (destellos rápidos)'],
 de:['Musikstil','Stil anwenden','Musikstil angewendet.','Energiepuls','Farbspektrum','Bass und Takt','Farbwelle','Stroboskop (schnelle Blitze)']
};
const styleIds = ['energy','spectrum','power','wavelength','strobe'];
const layoutLabels = {
 nl:['Ledkaart laden','Geen ledposities ontvangen','ledposities','Berekende indeling','Draai ledkaart'],
 en:['Load LED map','No LED positions received','LED positions','Generated layout','Rotate LED map'],
 es:['Cargar mapa LED','No se recibieron posiciones LED','posiciones LED','Diseño generado','Girar mapa LED'],
 de:['LED-Karte laden','Keine LED-Positionen empfangen','LED-Positionen','Berechnetes Layout','LED-Karte drehen']
};
const keys = 'tag all on off color brightness music stop setup add scan busy done receiving waiting disconnected load choose effect movie empty found enabled ip setupDone setupFailed'.split(' ');
const byId = id => document.getElementById(id);
const cards = new Map();
const lang = byId('language');
lang.value = localStorage.getItem('twinkly-language') || 'nl';
if (!lang.value) lang.value = 'nl';
const t = key => strings[lang.value][keys.indexOf(key)];
let busy = false, status;
async function request(path, data) {
  const response = await fetch('./' + path, data === undefined ? {cache:'no-store'} : {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
  });
  if (!response.ok) throw Error('HTTP ' + response.status);
  return response.json();
}
function translated(el, key) { el.dataset.text = key; el.textContent = t(key); }
async function perform(el, action) {
  if (busy) return;
  busy = true;
  el.disabled = true;
  byId('message').textContent = t('busy');
  try { byId('message').textContent = await action(); await refresh(); }
  catch (error) { byId('message').textContent = error.message; }
  finally { el.disabled = false; busy = false; }
}
function button(parent, key, action, primary = false) {
  const el = document.createElement('button');
  translated(el, key);
  if (primary) el.className = 'primary';
  el.onclick = () => perform(el, action);
  parent.append(el);
  return el;
}
async function run(id, action, value) {
  const result = await request('control', {id, action, value});
  return result.failed.length ? result.failed.join(' · ') : t('done');
}
function controls(parent, id) {
  const power = {};
  for (const key of ['on','off','music','stop']) power[key] = button(parent, key, () => run(id,key));
  const color = document.createElement('input');
  color.type = 'color'; color.value = '#e8a043'; color.dataset.label = 'color';
  color.setAttribute('aria-label',t('color'));
  parent.append(color); button(parent,'color', () => run(id,'color',color.value));
  const level = document.createElement('input');
  level.type = 'number'; level.min = 0; level.max = 100; level.value = 65; level.dataset.label = 'brightness';
  level.setAttribute('aria-label',t('brightness'));
  parent.append(level); button(parent,'brightness', () => run(id,'brightness',level.valueAsNumber));
  return power;
}
function renderEffects(card) {
  card.grid.replaceChildren();
  const [note, play, customName, save] = effectLabels[lang.value];
  card.note.textContent = card.effects.length ? note : '';
  for (const entry of card.effects) {
    const original = entry.name || t(entry.kind) + ' ' + entry.id;
    const key = 'twinkly-effect:' + JSON.stringify([card.id,entry.kind,entry.id,entry.name || '']);
    const tile = document.createElement('div');
    tile.className = 'effect-card';
    const title = document.createElement('strong');
    title.textContent = localStorage.getItem(key) || original;
    const playButton = document.createElement('button');
    playButton.textContent = play;
    playButton.onclick = () => perform(playButton, () => run(card.id,'effect',[entry.kind,entry.id]));
    const name = document.createElement('input');
    name.type = 'text'; name.maxLength = 60;
    name.placeholder = customName;
    name.setAttribute('aria-label',customName + ' · ' + original);
    name.value = localStorage.getItem(key) || '';
    const saveButton = document.createElement('button');
    saveButton.textContent = save;
    saveButton.onclick = () => {
      const value = name.value.trim();
      if (value) localStorage.setItem(key,value);
      else localStorage.removeItem(key);
      title.textContent = value || original;
      byId('message').textContent = t('done');
    };
    tile.append(title, playButton, name, saveButton);
    card.grid.append(tile);
  }
}
function drawLayout(card) {
  const [load, empty, positions, synthetic, rotate] = layoutLabels[lang.value];
  card.mapButton.textContent = load;
  if (!card.layout) return;
  const {points, source, synthesized} = card.layout;
  card.mapInfo.textContent = points.length
    ? [points.length + ' ' + positions, source, synthesized ? synthetic : ''].filter(Boolean).join(' · ')
    : empty;
  card.canvas.hidden = !points.length;
  card.rotation.hidden = source !== '3d' || !points.length;
  card.rotation.setAttribute('aria-label',rotate);
  if (!points.length) return;
  const ctx = card.canvas.getContext('2d');
  const {width, height} = card.canvas;
  ctx.clearRect(0,0,width,height);
  const angle = source === '3d' ? Number(card.rotation.value) * Math.PI / 180 : 0;
  const projected = points.map(([id,x,y,z]) => [id,x*Math.cos(angle)+z*Math.sin(angle),y]);
  const xs = projected.map(p => p[1]), ys = projected.map(p => p[2]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const scale = Math.min((width-30)/(maxX-minX || 1),(height-30)/(maxY-minY || 1));
  const radius = Math.max(1.7,Math.min(5,100/Math.sqrt(points.length)));
  for (const [id,x,y] of projected) {
    ctx.fillStyle = 'hsl(' + (40 + 145*id/Math.max(1,points.length-1)) + ' 75% 65%)';
    ctx.beginPath();
    ctx.arc(width/2 + (x-(minX+maxX)/2)*scale,height/2 - (y-(minY+maxY)/2)*scale,radius,0,Math.PI*2);
    ctx.fill();
  }
}
function render() {
  byId('audio').textContent = t(status ? (status.audio ? 'receiving' : 'waiting') : 'disconnected');
  for (const d of status?.devices || []) {
    if (!cards.has(d.id)) {
      const article = document.createElement('article');
      const title = document.createElement('h3'), info = document.createElement('p'), error = document.createElement('p');
      error.className = 'error';
      const actions = document.createElement('div'), effects = document.createElement('div');
      actions.className = 'controls'; effects.className = 'gap';
      const grid = document.createElement('div'), note = document.createElement('p');
      grid.className = 'effect-grid'; note.className = 'preview-note';
      const card = {id:d.id, title, info, error, grid, note, effects:[]};
      button(effects, 'load', async () => {
        const result = await request('effects?id=' + encodeURIComponent(d.id));
        if (result.error) return result.error;
        card.effects = result.effects;
        renderEffects(card);
        return card.effects.length ? t('done') : t('empty');
      });
      effects.append(note, grid);
      const map = document.createElement('div');
      map.className = 'led-map';
      const mapInfo = document.createElement('p'), canvas = document.createElement('canvas');
      canvas.width = 560; canvas.height = 320; canvas.hidden = true;
      const rotation = document.createElement('input');
      rotation.type = 'range'; rotation.min = -180; rotation.max = 180; rotation.value = 0;
      rotation.hidden = true;
      Object.assign(card,{mapInfo,canvas,rotation});
      const mapButton = document.createElement('button');
      card.mapButton = mapButton;
      mapButton.onclick = () => perform(mapButton, async () => {
        const result = await request('layout?id=' + encodeURIComponent(d.id));
        if (result.error) return result.error;
        card.layout = result.layout;
        drawLayout(card);
        return t('done');
      });
      rotation.oninput = () => drawLayout(card);
      map.append(mapButton,mapInfo,canvas,rotation);
      drawLayout(card);
      article.append(title, info, error, actions, effects, map);
      byId('devices').append(article);
      card.power = controls(actions, d.id);
      cards.set(d.id, card);
    }
    const {title, info, error, power} = cards.get(d.id);
    power.on.classList.toggle("power-active", Boolean(d.mode && d.mode !== "off"));
    power.off.classList.toggle("power-active", d.mode === "off");
    title.textContent = d.name;
    info.textContent = [d.ip, d.leds + ' LEDs', d.profile, d.music ? t('enabled') : ''].filter(Boolean).join(' · ');
    error.textContent = d.error || '';
    error.hidden = !d.error;
  }
}
async function refresh() { status = await request('status'); render(); }
controls(byId('all'), '*');
button(byId('music-setup'), 'setup', async () => {
  const result = await request('setup-music', {});
  return result.ok ? t('setupDone') : t('setupFailed') + ' · ' + result.message;
}, true);
const styleSelect = byId('music-style');
const styleButton = document.createElement('button');
styleButton.onclick = () => perform(styleButton, async () => {
  const result = await request('setup-music', {style:styleSelect.value});
  return result.ok ? musicStyles[lang.value][2] : t('setupFailed') + ' · ' + result.message;
});
byId('music-styles').append(styleButton);
async function register(ip) {
  const data = await request('register', {ip});
  return t('found') + ' · ' + data.added + ' ' + data.errors.join(' · ');
}
byId('ip').dataset.label = 'ip';
button(byId('scan'),'add', () => register(byId('ip').value.trim()));
button(byId('scan'),'scan', () => register(''));
function translate() {
  document.documentElement.lang = lang.value;
  const labels = musicStyles[lang.value];
  const selected = styleSelect.value || 'energy';
  byId('style-label').textContent = labels[0];
  styleButton.textContent = labels[1];
  styleSelect.replaceChildren(...styleIds.map((id,index) => new Option(labels[index+3],id)));
  styleSelect.value = selected;
  document.querySelectorAll('[data-text]').forEach(el => translated(el, el.dataset.text));
  document.querySelectorAll('[data-label]').forEach(el => el.setAttribute('aria-label',t(el.dataset.label)));
  for (const card of cards.values()) { renderEffects(card); drawLayout(card); }
  byId('message').textContent = '';
  render();
}
lang.onchange = () => { localStorage.setItem('twinkly-language',lang.value); translate(); };
translate();
const poll = async () => {
  try { await refresh(); } catch { status = undefined; render(); }
  setTimeout(poll, 2500);
};
poll();
</script></html>
