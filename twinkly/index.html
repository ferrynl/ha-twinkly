<main>

<div class="desk-grid">

</div></div>

<div class="music-actions"><div class="controls gap" id="music-styles"><label for="music-style" id="style-label"></label><select id="music-style"></select></div>
<p id="active-music-style" class="status"></p>
<div class="controls gap" id="music-preview-tools"></div>
<div id="music-preview-panel" class="gap" hidden><canvas id="music-preview" width="360" height="64"></canvas><p id="music-preview-status" role="status"></p></div>

</div></div></div></div></section>

</section>
<section><h2 id="settings-discover"></h2><div class="controls gap" id="scan"><input id="ip" placeholder="192.168.1.50" inputmode="decimal"></div>
</section>
<section><h2 id="settings-groups"></h2><form id="group-form">
<div class="controls"><input id="group-name" maxlength="60" required><label id="silence-label" for="group-silence"></label><select id="group-silence"></select><button id="group-save" type="submit"></button><button id="group-cancel" type="button" hidden></button></div>
<div class="controls gap" id="group-members"></div></form><div class="settings-list" id="group-management"></div></section>
<section><h2 id="settings-scenes"></h2>

<div class="settings-list" id="scene-management"></div></section>

};
function modelInfo(code, device) {
  const strings = /^TWS(\d{2,4})(SPP|STP|GOP)[A-Z0-9-]*$/i.exec(code);
  if (strings) {
    const rgbw = strings[2].toUpperCase() === 'SPP';
    const suffix = {SPP:'RGB+W',STP:'RGB',GOP:'AWW'}[strings[2].toUpperCase()];
    return {name:'Twinkly Strings · ' + device.leds + ' LEDs · ' + suffix,
      photo:rgbw ? 'strings-rgbw' : ''};
  }
  if (/^TWL\d{2,4}STW[A-Z0-9-]*$/i.test(code)) {
    return {name:'Twinkly Line · ' + device.leds + ' LEDs',photo:'line'};
  }
  return {name:productLabels[lang.value] + ' · ' + code};
}
function drawProduct(card, device) {
  const code = typeof device.product_code === 'string' ? device.product_code.trim() : '';
  card.product.hidden = !code;
  if (!code) return;
  const signature = code + '/' + device.leds + '/' + lang.value;
  if (card.productSignature === signature) return;
  card.productSignature = signature;
  const model = modelInfo(code,device);
  const title = document.createElement('strong'), subtitle = document.createElement('small');
  const body = document.createElement('div');
  title.textContent = model.name;
  body.append(title);
  if (!model.name.endsWith(' · ' + code)) {
    subtitle.textContent = code;
    body.append(subtitle);
  }
  card.product.replaceChildren();
  if (model.photo) {
    const photo = document.createElement('img');
    photo.loading = 'lazy'; photo.referrerPolicy = 'no-referrer';
    photo.alt = model.name;
    photo.onerror = () => { photo.hidden = true; };
    photo.src = './product-photo/' + model.photo;

    pad.className = 'scene-pad';
    play.textContent = scene.name;
    play.onclick = () => perform(play,() => applyScene(scene));
    pad.append(play);
    if (id) {
      const remove = document.createElement('button');
      remove.textContent = '×';
      remove.setAttribute('aria-label',extra(5) + ' ' + scene.name);
      remove.onclick = () => perform(remove,async () => { await request('show',{delete:id}); return t('done'); });
      const entry = document.createElement('div'), name = document.createElement('strong');
      entry.className = 'settings-item'; name.textContent = scene.name;
      entry.append(name,remove); manage.append(entry);
    }
    pads.append(pad);
  }
}
byId('scene-form').onsubmit = event => {
  event.preventDefault();
  perform(byId('scene-save'),async () => {
    await request('show',{name:byId('scene-name').value,group:byId('scene-group').value,
      mode:byId('scene-mode').value,style:byId('scene-style').value,level:byId('scene-level').valueAsNumber});
    byId('scene-name').value = '';
    return t('done');
  });
};
const tvSourceText = {
 nl:['Tv-bron','Automatisch','Spelers vernieuwen','Mediaspelers konden niet worden opgehaald.'],
 en:['TV source','Automatic','Refresh players','Could not load media players.'],
 es:['Fuente de TV','Automática','Actualizar reproductores','No se pudieron cargar los reproductores.'],
 de:['TV-Quelle','Automatisch','Player aktualisieren','Mediaplayer konnten nicht geladen werden.']
};
const tvSelect = byId('tv-source');
const tvRefresh = byId('tv-refresh');
let tvPlayers = [], tvSelected = '';
let trackState, trackArtwork, coverFallback;
function renderTvSource() {
  const [label, automatic, refresh] = tvSourceText[lang.value];
  byId('tv-source-label').textContent = label;
  tvRefresh.textContent = refresh;
  const options = tvPlayers.map(player => new Option(player.name + ' · ' + player.id,player.id));
  if (tvSelected && !tvPlayers.some(player => player.id === tvSelected)) {
    options.push(new Option(tvSelected,tvSelected));
  }
  tvSelect.replaceChildren(new Option(automatic,''),...options);
  tvSelect.value = tvSelected;
}
async function loadTvSources() {
  try {
    const result = await request('media-players');
    tvPlayers = result.players;
    tvSelected = result.selected;
    renderTvSource();
    return t('done');
  } catch {
    return tvSourceText[lang.value][3];
  }
}
tvRefresh.onclick = () => perform(tvRefresh,loadTvSources);
tvSelect.onchange = async () => {
  const player = tvSelect.value;
  if (busy) { tvSelect.value = tvSelected; return; }
  await perform(tvSelect, async () => {
    await request('media-players',{player});
    tvSelected = player;
    trackState = await request('now-playing');
    renderTrack();
    return t('done');
  });
  tvSelect.value = tvSelected;
};
function renderTrack() {
  const labels = trackLabels[lang.value];
  const track = trackState?.track;
  byId('track-label').textContent = labels[0];
  byId('track-title').textContent = track?.title || labels[trackState?.available === false ? 2 : 1];
  byId('track-byline').textContent = [track?.artist,track?.album].filter(Boolean).join(' · ');
  const image = byId('track-art');
  const artwork = track?.artwork ? './now-playing-art?v=' + encodeURIComponent(track.artwork) : track?.cover_url;
  coverFallback = track?.artwork ? track.cover_url : undefined;
  image.hidden = !image.complete || !image.naturalWidth;
  byId('track-idle').hidden = !image.hidden;
  if (artwork === trackArtwork) return;
  trackArtwork = artwork;
  image.hidden = true;
  byId('track-idle').hidden = false;
  if (artwork) image.src = artwork;
  else image.removeAttribute('src');
}
byId('track-art').onload = () => { byId('track-art').hidden = false; byId('track-idle').hidden = true; };
byId('track-art').onerror = () => {
  const image = byId('track-art');
  if (coverFallback && image.src !== new URL(coverFallback).href) { image.src = coverFallback; return; }
  image.hidden = true;
  byId('track-idle').hidden = !!trackVideo;
};
async function pollTrack() {
  if (!document.hidden) {
    try { trackState = await request('now-playing'); }
    catch { trackState = {available:false}; }
    if (typeof trackState?.player === 'string' && tvSelected !== trackState.player && !tvSelect.disabled) {
      tvSelected = trackState.player;
      renderTvSource();
    }
    renderTrack();
  }
  setTimeout(pollTrack,4000);
}
function showPage() {
  const settings = location.hash === '#instellingen';
  byId('control-page').hidden = settings;
  byId('settings-page').hidden = !settings;
  byId('nav-control').setAttribute('aria-current',settings ? 'false' : 'page');
  byId('nav-settings').setAttribute('aria-current',settings ? 'page' : 'false');
  if (!settings) schedulePreview();
}
window.addEventListener('hashchange',showPage);
function translate() {
  document.documentElement.lang = lang.value;
  ['nav-control','nav-settings','device-title','settings-general','settings-music','settings-discover','settings-groups','settings-scenes','settings-effects'].forEach((id,index) => {
    byId(id).textContent = pageLabels[lang.value][index];
  });
  showPage();
  renderTrack();
  renderTvSource();
  byId('show-title').textContent = showLabel(0);
  byId('master-label').textContent = showLabel(1);
  byId('master-save').textContent = showLabel(2);
  byId('scene-name').placeholder = showLabel(3);
  byId('scene-name').setAttribute('aria-label',showLabel(3));
  byId('scene-save').textContent = showLabel(4);
  byId('scene-group').setAttribute('aria-label',extra(0));
  const mode = byId('scene-mode'), previousMode = mode.value || 'music';
  mode.setAttribute('aria-label',t('music'));
  mode.replaceChildren(new Option(showLabel(12),'music'),new Option(t('off'),'off'));
  mode.value = previousMode;
  byId('silence-label').textContent = showLabel(5);
  const silence = byId('group-silence'), previousSilence = silence.value || 'restore';
  silence.replaceChildren(...['restore','warm','fade'].map((value,index) => new Option(showLabel(6+index),value)));
  silence.value = previousSilence;
  byId('desk-music-title').textContent = detailsText[lang.value][0];
  byId('group-title').textContent = extra(0);
  byId('group-name').placeholder = extra(1);
  byId('group-name').setAttribute('aria-label',extra(1));
  byId('group-save').textContent = extra(2);
  byId('group-cancel').textContent = extra(3);
  const labels = musicStyles[lang.value];
  const selected = styleSelect.value || 'energy';
  byId('style-label').textContent = labels[0];
  styleButton.textContent = labels[1];
  const options = labels.slice(3).concat(moreStyles[lang.value]);
  styleSelect.replaceChildren(...styleIds.map((id,index) => new Option(options[index],id)));
  updatePreviewLabels();
  styleSelect.value = selected;
  const sceneStyle = byId('scene-style'), prior = sceneStyle.value || selected;
  sceneStyle.replaceChildren(...styleIds.map((id,index) => new Option(options[index],id)));
  sceneStyle.value = prior;
  sceneStyle.setAttribute('aria-label',labels[0]);
  byId('scene-level').setAttribute('aria-label',showLabel(1));
  document.querySelectorAll('[data-text]').forEach(el => translated(el, el.dataset.text));
  document.querySelectorAll('[data-label]').forEach(el => el.setAttribute('aria-label',t(el.dataset.label)));
  for (const card of cards.values()) { renderEffects(card); drawLayout(card); drawDetails(card); }
  byId('message').textContent = '';
  render();
}
lang.onchange = () => { localStorage.setItem('twinkly-language',lang.value); translate(); };
translate();
const poll = async () => {
  try { await refresh(); } catch { status = undefined; render(); }
  setTimeout(poll, 2500);
};
poll();
pollTrack();
loadTvSources();
</script></html>
