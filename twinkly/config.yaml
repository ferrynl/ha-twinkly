name: Christmas Control Center
slug: twinkly_kerst
version: "2.0.0"
description: Lokale bediening en lichtshows voor Twinkly, Philips Hue en Govee.
url: https://github.com/ferrynl/ha-twinkly
arch:
- amd64
- aarch64
startup: application
boot: auto
init: false
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 18489
panel_icon: mdi:string-lights
options:
  ddp_source: 127.0.0.1
  discovery_broadcast: 255.255.255.255
  fps: 20
  media_player: ''
schema:
  ddp_source: str
  discovery_broadcast: str
  fps: int(5,25)
  media_player: str
  govee_api_key: "password?"
