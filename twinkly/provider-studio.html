<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Christmas Control Center · Lighting</title><style>body{background:#10231d;color:#edf8f1;font:16px system-ui;margin:auto;padding:24px;max-width:1000px}nav,section,article{display:flex;gap:12px;flex-wrap:wrap;align-items:center}section,article{background:#203a30;padding:18px;border-radius:16px;margin:12px 0}h1,h2{width:100%}button,input,a{font:inherit;color:inherit;background:#304b40;border:1px solid #789889;border-radius:8px;padding:10px}button{cursor:pointer}input{max-width:100%;box-sizing:border-box}a{text-decoration:none}#message{min-height:2em}label{display:grid;gap:5px}</style><nav><a href="./">Christmas Control Center</a><a href="#hue">Hue</a><a href="#govee">Govee</a></nav><h1 id="title"></h1><section><button id="scan">Discover / Zoeken</button><button id="refresh">Refresh / Vernieuwen</button><div id="found"></div></section><section><h2 id="connect-title">Connect</h2><p id="help" style="width:100%"></p><label>ID<input id="identifier" maxlength="128"></label><label>IP<input id="address"></label><label id="pinlabel"><span id="pintext">SHA256 TLS fingerprint</span><input id="pin" maxlength="64" autocomplete="off"></label><button id="connect">Connect / Koppelen</button></section><p id="message" role="status"></p><main id="devices"></main><script>
const words={nl:["Zoeken","Vernieuwen","Koppelen","Druk op de fysieke Hue Bridge-knop vlak voor het koppelen. Voer de SHA256-vingerafdruk in die je via een vertrouwde bron hebt gecontroleerd. Vertrouw geen onbekend certificaat.","Activeer LAN-bediening in de Govee-app.","Aan","Uit","Helderheid","Kleur","Verzonden (niet bevestigd)","Druk op de Bridge-knop en probeer opnieuw."],en:["Discover","Refresh","Connect","Press the physical Hue Bridge button just before pairing. Enter a SHA256 fingerprint verified through a trusted source. Never trust an unknown certificate.","Enable LAN control in the Govee app.","On","Off","Brightness","Color","Sent (unconfirmed)","Press the bridge button and retry."],de:["Suchen","Aktualisieren","Verbinden","Drücke vor dem Verbinden die Taste der Hue Bridge. Verwende einen SHA256-Fingerabdruck aus einer vertrauenswürdigen Quelle.","Aktiviere die LAN-Steuerung in der Govee-App.","Ein","Aus","Helligkeit","Farbe","Gesendet (unbestätigt)","Drücke die Bridge-Taste und versuche es erneut."],es:["Buscar","Actualizar","Conectar","Pulsa el botón físico del puente Hue antes de conectar. Introduce una huella SHA256 verificada mediante una fuente fiable.","Activa el control LAN en la aplicación Govee.","Encender","Apagar","Brillo","Color","Enviado (sin confirmar)","Pulsa el botón del puente e inténtalo de nuevo."]};const language=localStorage.getItem("twinkly-language")||"en",w=words[language]||words.en;document.documentElement.lang=words[language]?language:"en";const el=id=>document.getElementById(id), provider=()=>location.hash==="#govee"?"govee":"hue";
async function api(path,body){const r=await fetch("providers/"+path,body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
function button(label,fn){const b=document.createElement("button");b.textContent=label;b.onclick=()=>task(fn,b);return b}
async function task(fn,b){if(b)b.disabled=true;try{await fn()}catch(e){el("message").textContent=e.message==="pairing_permission"?w[10]:e.message}finally{if(b)b.disabled=false}}
async function scan(){const p=provider(),j=await api(p+"/discover",{});if(p!==provider())return;el("found").replaceChildren();for(const d of j.devices){el("found").append(button((d.name||d.sku)+" · "+(d.ip||d.addresses[0]),()=>{el("identifier").value=d.bridge_id||d.device;el("address").value=d.ip||d.addresses[0]}))}}
async function refresh(){const p=provider(),j=await api(p+"/inventory");if(p!==provider())return;el("devices").replaceChildren();for(const d of j.devices){const list=p==="hue"?d.lights:[{id:d.id,name:d.id,capabilities:{power:true,brightness:true,rgb:true}}];for(const l of list){const a=document.createElement("article"),h=document.createElement("h2");h.textContent=l.name;a.append(h);const send=async(action,value)=>{const r=await api(p+"/control",{id:d.id,light_id:l.id,action,value});el("message").textContent=r.confirmed?"OK":w[9]};if(l.capabilities.power)a.append(button(w[5],()=>send("power",true)),button(w[6],()=>send("power",false)));if(l.capabilities.brightness){const i=document.createElement("input");i.type="range";i.min=1;i.max=100;i.value=l.state?.brightness||50;i.setAttribute("aria-label",w[7]);i.onchange=()=>task(()=>send("brightness",Number(i.value)));a.append(i)}if(l.capabilities.rgb){const i=document.createElement("input");i.type="color";i.setAttribute("aria-label",w[8]);i.onchange=()=>task(()=>send("color",i.value.slice(1).match(/../g).map(x=>parseInt(x,16))));a.append(i)}el("devices").append(a)}if(!list.length){const a=document.createElement("article");a.textContent=d.id+" · "+d.status;el("devices").append(a)}}}
el("connect").onclick=()=>task(async()=>{const p=provider();await api(p+"/connect",{id:el("identifier").value,address:el("address").value,certificate_sha256:el("pin").value});el("pin").value="";await refresh()},el("connect"));el("scan").onclick=()=>task(scan,el("scan"));el("refresh").onclick=()=>task(refresh,el("refresh"));function page(){el("scan").textContent=w[0];el("refresh").textContent=w[1];el("connect").textContent=el("connect-title").textContent=w[2];el("help").textContent=provider()==="hue"?w[3]:w[4];el("title").textContent=provider()==="hue"?"Philips Hue":"Govee";el("pinlabel").hidden=provider()!=="hue";el("pinlabel").style.display=provider()==="hue"?"grid":"none";el("found").replaceChildren();el("identifier").value=el("address").value=el("pin").value="";task(refresh)}window.onhashchange=page;page();
</script></html>
