name: Direct light provider tests
on:
  pull_request:
  push:
    branches: ['feature/direct-light-providers-v2', main]
permissions:
  contents: read
jobs:
  provider-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install aiohttp==3.13.5 zeroconf==0.148.0 coverage==7.13.4
      - working-directory: twinkly
        run: |
          python -m compileall -q modules
          python -m coverage run --branch --source=modules -m unittest discover -p 'test*provider*.py' -v
          python -m coverage report --show-missing
